<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NANO-ULTRA-JAMES</title>
<style>
:root{--paper:#E6ECF4;--panel:#F7F9FC;--ink:#1D2A3F;--muted:#5B6A82;--line:#CCD5E2;
--greetings:#E09A12;--tech:#2F6BFF;--gaming:#8452F0;--school:#0E9F86}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:minmax(320px,5fr) minmax(380px,6fr);height:100%}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.01em}
header small{display:block;color:var(--muted);font-size:12.5px}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#aab4c3}
.dot.ok{background:var(--school)}.dot.bad{background:#D64550}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:20px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,var(--tech));border-bottom-left-radius:4px}
.meta{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.err{align-self:center;max-width:90%;text-align:center;font-size:13px;color:#B3261E}
form{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:none;color:var(--muted);border:1px solid var(--line);padding:6px 12px;font-size:13px;font-weight:500}
:focus-visible{outline:3px solid var(--tech);outline-offset:2px}
.brain{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{position:relative;flex:1;min-height:300px;background-image:linear-gradient(rgba(29,42,63,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,42,63,.07) 1px,transparent 1px);background-size:24px 24px}
canvas{position:absolute;inset:0;width:100%;height:100%}
.stats{padding:16px 20px;background:var(--panel);border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:76px 1fr 38px;gap:10px;align-items:center;margin-bottom:6px;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s}
dl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;margin:14px 0}
dt{font-size:12px;color:var(--muted)}
dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}.chat{height:82vh;border-right:0}dl{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <main class="chat">
    <header>
      <div><h1>NANO-ULTRA-JAMES</h1><small id="ver">JB-7.0 (Adaptive Neural AI Brain)</small></div>
      <span class="status"><i class="dot" id="dot"></i><span id="stat">Connecting</span></span>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="f">
      <input id="q" autocomplete="off" maxlength="500" placeholder="Talk about games, code, or school" aria-label="Message">
      <button id="send">Send</button>
    </form>
  </main>
  <section class="brain" aria-label="Neural network activity">
    <div class="stage"><canvas id="net" role="img" aria-label="Neural network, idle"></canvas></div>
    <div class="stats">
      <div id="bars"></div><dl id="dl"></dl>
      <button class="ghost" id="reset" type="button">Reset memory</button>
    </div>
  </section>
</div>
<script>
const T=['greetings','tech','gaming','school'];
const LABELS={turns_learned:'Turns learned',learning_rate:'Learning rate',error_rate:'Error rate',confidence:'Confidence',
  gradient_magnitude:'Gradient',active_synapses:'Active synapses',hidden_neurons:'Hidden neurons',error_trend:'Error trend'};
const C=getComputedStyle(document.documentElement);
const col=t=>C.getPropertyValue('--'+t).trim();
const $=s=>document.querySelector(s);
const log=$('#log'),q=$('#q'),cv=$('#net'),ctx=cv.getContext('2d');
let viz=null,prog=1,raf=0,W=0,H=0;

async function api(path,body){
  const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
  return r.json();
}
function add(cls,text,meta,topic){
  const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
  if(topic)d.style.setProperty('--c',col(topic));
  if(meta){const m=document.createElement('span');m.className='meta';m.textContent=meta;d.append(m)}
  log.append(d);log.scrollTop=log.scrollHeight;return d;
}
function online(ok){$('#dot').className='dot '+(ok?'ok':'bad');$('#stat').textContent=ok?'Backend connected':'Backend offline'}
function showStats(t){
  $('#bars').innerHTML=T.map(k=>{const p=Math.round((t.context[k]||0)*100);
    return `<div class="row"><span>${k}</span><span class="bar"><i style="width:${p}%;background:${col(k)}"></i></span><span>${p}%</span></div>`}).join('');
  $('#dl').innerHTML=Object.keys(LABELS).map(k=>`<div><dt>${LABELS[k]}</dt><dd>${t[k]}</dd></div>`).join('');
}

function layout(){
  const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const v=viz,ink=C.getPropertyValue('--ink').trim(),mut=C.getPropertyValue('--muted').trim();
  const inX=Math.max(88,W*.17),gx=W*.36,cw=W*.34/15,rh=H*.78/7,ox=W*.88;
  const hp=j=>[gx+(j%16)*cw,H*.11+((j/16)|0)*rh],op=k=>[ox,H*(.2+k*.2)];
  const ph=(a,b)=>Math.min(1,Math.max(0,(prog-a)/(b-a)));
  const hid=v?v.hidden:[],mx=Math.max(...hid,1e-6),win=v?T.indexOf(v.topic):-1,wc=win<0?mut:col(T[win]);
  const n=v?v.tokens.length:0,ip=i=>[inX,n<2?H/2:H*.16+i*H*.68/(n-1)];
  if(v){
    ctx.lineWidth=1;ctx.strokeStyle=wc;   // inputs to the most active hidden neurons
    v.tokens.forEach((_,i)=>v.top.forEach(j=>{const a=hid[j]/mx*.5*ph(0,.4);if(a<.02)return;
      ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(...ip(i));ctx.lineTo(...hp(j));ctx.stroke()}));
    const mc=Math.max(...v.contrib.flat(),1e-6);   // hidden neurons to topic outputs
    v.top.forEach((j,r)=>T.forEach((t,k)=>{const c=v.contrib[r][k];if(c<=0)return;
      const a=Math.min(.9,c/mc)*ph(.5,.9);ctx.globalAlpha=a;ctx.strokeStyle=col(t);ctx.lineWidth=1+1.5*a;
      ctx.beginPath();ctx.moveTo(...hp(j));ctx.lineTo(...op(k));ctx.stroke()}));
  }
  ctx.globalAlpha=1;
  for(let j=0;j<128;j++){const [x,y]=hp(j),a=v?hid[j]/mx*ph(.2,.6):0;
    ctx.beginPath();ctx.arc(x,y,2.4+3*a,0,7);ctx.fillStyle=a>.02?wc:mut;ctx.globalAlpha=a>.02?.25+.75*a:.3;ctx.fill()}
  ctx.globalAlpha=1;ctx.font='12px system-ui,sans-serif';ctx.textBaseline='middle';
  (v?v.tokens:[]).forEach((w,i)=>{const [x,y]=ip(i);ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fillStyle=ink;ctx.fill();
    ctx.textAlign='right';ctx.fillText(w,x-11,y)});
  T.forEach((t,k)=>{const [x,y]=op(k),p=v?v.probs[k]:.25,r=v?7+12*p*ph(.6,1):8;
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=col(t);ctx.globalAlpha=v?(k===win?1:.45):.3;ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText(t,x,y-r-9);
    if(v)ctx.fillText(Math.round(p*100*ph(.6,1))+'%',x,y+r+10)});
  if(!v){ctx.fillStyle=mut;ctx.textAlign='center';ctx.fillText('Send a message to light up the network',W*.5,H-16)}
}
function play(){
  cancelAnimationFrame(raf);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){prog=1;draw();return}
  prog=0;const t0=performance.now();
  const step=n=>{prog=Math.min(1,(n-t0)/900);draw();if(prog<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
new ResizeObserver(()=>{layout();draw()}).observe(cv);

$('#f').onsubmit=async e=>{
  e.preventDefault();const m=q.value.trim();if(!m)return;
  q.value='';add('me',m);$('#send').disabled=true;
  const wait=add('bot','…');
  try{
    const r=await api('/api/chat',{message:m}),pct=Math.round(r.confidence*100);
    const src=r.seed.startsWith('identity')?'a built-in answer':r.seed.startsWith('user')?'your own wording':'a topic phrase';
    wait.remove();add('bot',r.reply,`Topic: ${r.topic} at ${pct}% confidence. Started from ${src}.`,r.topic);
    showStats(r.telemetry);
    if(r.viz){viz=r.viz;play();cv.setAttribute('aria-label',`Network settled on ${r.topic} at ${pct}% confidence`)}
    online(true);
  }catch(err){
    wait.remove();add('err','Could not reach the backend. Start it with "python backend.py", then reload this page.');online(false);
  }
  $('#send').disabled=false;q.focus();
};
$('#reset').onclick=async()=>{
  if(!confirm('Erase everything James has learned and retrain from scratch?'))return;
  try{const s=await api('/api/reset',{});viz=null;showStats(s.telemetry);draw();add('err','Memory reset. James retrained from the built-in corpora.')}
  catch{online(false)}
};
(async()=>{
  layout();draw();
  add('bot',"Hi, I'm James. Ask me about games, code, or school and watch the network on the right respond.",null,'greetings');
  try{const s=await api('/api/state');$('#ver').textContent=s.version;showStats(s.telemetry);online(true)}
  catch{online(false);add('err','The backend is not running. Start it with "python backend.py", then reload this page.')}
})();
</script>
</body>
</html>
