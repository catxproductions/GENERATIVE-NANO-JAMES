<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GENERATIVE-NANO-JAMES</title>
<style>
:root {
  --paper: #0F172A;
  --panel: #1E293B;
  --ink: #F8FAFC;
  --muted: #94A3B8;
  --line: #334155;
  --greetings: #F59E0B;
  --tech: #3B82F6;
  --gaming: #A855F7;
  --school: #10B981;
  --accent: #EC4899;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
.app { display: grid; grid-template-columns: minmax(340px, 5fr) minmax(400px, 6fr); height: 100%; }
.chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .01em; color: var(--ink); }
header small { display: block; color: var(--muted); font-size: 12.5px; }
.status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #64748B; }
.dot.ok { background: var(--school); }
.dot.bad { background: #EF4444; }
#log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
.me { align-self: flex-end; background: var(--tech); color: #fff; border-bottom-right-radius: 4px; }
.bot { align-self: flex-start; background: #0F172A; border: 1px solid var(--line); border-left: 4px solid var(--c, var(--tech)); border-bottom-left-radius: 4px; }
.meta { display: block; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.err { align-self: center; max-width: 90%; text-align: center; font-size: 13px; color: #F87171; }
form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
input { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #0F172A; color: inherit; }
button { font: inherit; font-weight: 600; padding: 10px 16px; border: 0; border-radius: 10px; background: var(--tech); color: #fff; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button.ghost { background: none; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-size: 13px; font-weight: 500; }
.brain { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--paper); }
.stage { position: relative; flex: 1; min-height: 280px; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 24px 24px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stats { padding: 16px 20px; background: var(--panel); border-top: 1px solid var(--line); overflow-y: auto; max-height: 45vh; }
.row { display: grid; grid-template-columns: 76px 1fr 38px; gap: 10px; align-items: center; margin-bottom: 6px; font-size: 13px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; transition: width .5s; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--line); color: var(--accent); margin-left: 6px; }
dl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 16px; margin: 14px 0; }
dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.mod-log { font-size: 11.5px; color: var(--muted); background: #0F172A; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); margin-top: 10px; max-height: 70px; overflow-y: auto; }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; height: auto; } .chat { height: 75vh; border-right: 0; } dl { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="app">
  <main class="chat">
    <header>
      <div>
        <h1>GENERATIVE-NANO-JAMES <span class="badge" id="p-state">NEUTRAL</span></h1>
        <small id="ver">JB-Generative-7.5 (Generative Hybrid AI)</small>
      </div>
      <span class="status"><i class="dot" id="dot"></i><span id="stat">Connecting</span></span>
    </header>
    <div id="log" role="log"></div>
    <form id="f">
      <input id="q" autocomplete="off" maxlength="500" placeholder="Ask James about games, code, school, or test his dictionary expansion..." aria-label="Message">
      <button id="send">Send</button>
    </form>
  </main>
  <section class="brain">
    <div class="stage"><canvas id="net"></canvas></div>
    <div class="stats">
      <div id="bars"></div>
      <dl id="dl"></dl>
      <div>
        <dt>Self-Modification Audit Log</dt>
        <div class="mod-log" id="mod-log">No self-rewrite parameters modified yet.</div>
      </div>
      <div style="margin-top: 12px;">
        <button class="ghost" id="reset" type="button">Reset Memory & Weights</button>
      </div>
    </div>
  </section>
</div>

<script>
const T = ['greetings', 'tech', 'gaming', 'school'];
const LABELS = {
  turns_learned: 'Turns Learned', learning_rate: 'Learning Rate', error_rate: 'Error Rate', confidence: 'Confidence',
  gradient_magnitude: 'Gradient', active_synapses: 'Active Synapses', hidden_neurons: 'Hidden Neurons', dictionary_vocab_size: 'Dict Entries'
};

const C = getComputedStyle(document.documentElement);
const col = t => C.getPropertyValue('--' + t).trim();
const $ = s => document.querySelector(s);
const log = $('#log'), q = $('#q'), cv = $('#net'), ctx = cv.getContext('2d');
let viz = null, prog = 1, raf = 0, W = 0, H = 0;

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

function add(cls, text, meta, topic) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  if (topic) d.style.setProperty('--c', col(topic));
  if (meta) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = meta; d.append(m); }
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}

function online(ok) { $('#dot').className = 'dot ' + (ok ? 'ok' : 'bad'); $('#stat').textContent = ok ? 'Backend Connected' : 'Backend Offline'; }

function showStats(t) {
  if (t.personality) {
    $('#p-state').textContent = t.personality.current_state;
  }
  $('#bars').innerHTML = T.map(k => {
    const p = Math.round((t.context[k] || 0) * 100);
    return `<div class="row"><span>${k}</span><span class="bar"><i style="width:${p}%;background:${col(k)}"></i></span><span>${p}%</span></div>`;
  }).join('');
  
  $('#dl').innerHTML = Object.keys(LABELS).map(k => `<div><dt>${LABELS[k]}</dt><dd>${t[k] !== undefined ? t[k] : 'N/A'}</dd></div>`).join('');
  
  if (t.self_rewriter && t.self_rewriter.history.length > 0) {
    const last = t.self_rewriter.history[t.self_rewriter.history.length - 1];
    $('#mod-log').textContent = `[${last.timestamp.split('T')[1].split('.')[0]}] ${last.mods.join(' | ')}`;
  }
}

function layout() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const v = viz, ink = C.getPropertyValue('--ink').trim(), mut = C.getPropertyValue('--muted').trim();
  const inX = Math.max(88, W * .17), gx = W * .36, cw = W * .34 / 15, rh = H * .78 / 7, ox = W * .88;
  const hp = j => [gx + (j % 16) * cw, H * .11 + ((j / 16) | 0) * rh], op = k => [ox, H * (.2 + k * .2)];
  const ph = (a, b) => Math.min(1, Math.max(0, (prog - a) / (b - a)));
  const hid = v ? v.hidden : [], mx = Math.max(...hid, 1e-6), win = v ? T.indexOf(v.topic) : -1, wc = win < 0 ? mut : col(T[win]);
  const n = v ? v.tokens.length : 0, ip = i => [inX, n < 2 ? H / 2 : H * .16 + i * H * .68 / (n - 1)];

  if (v) {
    ctx.lineWidth = 1; ctx.strokeStyle = wc;
    v.tokens.forEach((_, i) => v.top.forEach(j => {
      const a = hid[j] / mx * .5 * ph(0, .4); if (a < .02) return;
      ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(...ip(i)); ctx.lineTo(...hp(j)); ctx.stroke();
    }));
    const mc = Math.max(...v.contrib.flat(), 1e-6);
    v.top.forEach((j, r) => T.forEach((t, k) => {
      const c = v.contrib[r][k]; if (c <= 0) return;
      const a = Math.min(.9, c / mc) * ph(.5, .9); ctx.globalAlpha = a; ctx.strokeStyle = col(t); ctx.lineWidth = 1 + 1.5 * a;
      ctx.beginPath(); ctx.moveTo(...hp(j)); ctx.lineTo(...op(k)); ctx.stroke();
    }));
  }

  ctx.globalAlpha = 1;
  for (let j = 0; j < 128; j++) {
    const [x, y] = hp(j), a = v ? hid[j] / mx * ph(.2, .6) : 0;
    ctx.beginPath(); ctx.arc(x, y, 2.4 + 3 * a, 0, 7); ctx.fillStyle = a > .02 ? wc : mut; ctx.globalAlpha = a > .02 ? .25 + .75 * a : .3; ctx.fill();
  }

  ctx.globalAlpha = 1; ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  (v ? v.tokens : []).forEach((w, i) => {
    const [x, y] = ip(i); ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = ink; ctx.fill();
    ctx.textAlign = 'right'; ctx.fillText(w, x - 11, y);
  });

  T.forEach((t, k) => {
    const [x, y] = op(k), p = v ? v.probs[k] : .25, r = v ? 7 + 12 * p * ph(.6, 1) : 8;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = col(t); ctx.globalAlpha = v ? (k === win ? 1 : .45) : .3; ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.fillText(t, x, y - r - 9);
    if (v) ctx.fillText(Math.round(p * 100 * ph(.6, 1)) + '%', x, y + r + 10);
  });
}

function play() {
  cancelAnimationFrame(raf);
  prog = 0; const t0 = performance.now();
  const step = n => { prog = Math.min(1, (n - t0) / 900); draw(); if (prog < 1) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
}

new ResizeObserver(() => { layout(); draw(); }).observe(cv);

$('#f').onsubmit = async e => {
  e.preventDefault(); const m = q.value.trim(); if (!m) return;
  q.value = ''; add('me', m); $('#send').disabled = true;
  const wait = add('bot', '…');
  try {
    const r = await api('/api/chat', { message: m }), pct = Math.round(r.confidence * 100);
    wait.remove();
    add('bot', r.reply, `Topic: ${r.topic} (${pct}% confidence) | Generator Seed: ${r.seed}`, r.topic);
    showStats(r.telemetry);
    if (r.viz) { viz = r.viz; play(); }
    online(true);
  } catch (err) {
    wait.remove(); add('err', 'Could not reach backend. Start server with "python backend.py"'); online(false);
  }
  $('#send').disabled = false; q.focus();
};

$('#reset').onclick = async () => {
  if (!confirm('Erase learned memory, reset self-modification logs and weights.json?')) return;
  try {
    const s = await api('/api/reset', {}); viz = null; showStats(s.telemetry); draw();
    add('err', 'Memory reset successfully. Retrained initial matrices.');
  } catch { online(false); }
};

(async () => {
  layout(); draw();
  add('bot', "Hello! I am James (JB-Generative-7.5). Send a message to inspect my dynamic personality matrix and neural activation visualizer.", null, 'greetings');
  try {
    const s = await api('/api/state');
    $('#ver').textContent = s.version;
    showStats(s.telemetry);
    online(true);
  } catch { online(false); }
})();
</script>
</body>
</html>
